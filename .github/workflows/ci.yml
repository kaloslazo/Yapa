# Pruebas en cada subida y pull request (jobs motor y web, de Kalos) + despliegue automático (iteración 52,
# api/docs/desarrollo/52-despliegue-automatico.md):
#   - Cada subida a cualquier rama y cada pull request corren las pruebas y arman el paquete (DA-01, DA-02).
#   - Solo una subida a main despliega (S-270), y solo si pasaron motor y web (S-271). Desde el 09/11/2026 en AWS
#     Lightsail (deploy/aws/README.md); antes en la VPS con un runner propio (deploy/vps/).
name: tests

on:
  # Un cambio que solo toca documentación no corre pruebas ni despliega (ahorra minutos de CI)
  push:
    paths-ignore: ["**/*.md", "docs/**", "api/docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "api/docs/**"]

permissions:
  contents: read
  actions: read

jobs:
  motor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyJWT cryptography  # S-214: sin esto se saltan las pruebas de Google
      - run: python -m compileall -q src  # sintaxis de todos los archivos, también los que ninguna prueba importa (p. ej. web/__main__.py)
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # DA-02: el paquete (api/src y dist) con la misma forma que el paquete manual
      - name: Armar el paquete
        run: |
          mkdir -p paquete/api
          cp -r api/src paquete/api/src
          cp -r dist paquete/dist
          find paquete -name '__pycache__' -type d -prune -exec rm -rf {} +
          test -f paquete/dist/index.html
          test -f paquete/api/src/yapa_sdd/web/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: yapa-app
          path: paquete
          if-no-files-found: error
          retention-days: 14

  desplegar:
    # AWS Lightsail (deploy/aws/README.md). Reemplaza al runner de la VPS (iteración 52), que quedó desconectado.
    name: desplegar en AWS
    needs: [motor, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: despliegue-yapa
      cancel-in-progress: false
    env:
      AWS_HOST: ${{ secrets.AWS_HOST }}
    steps:
      - name: Sin servidor configurado, no se despliega
        if: env.AWS_HOST == ''
        run: echo "Falta el secreto AWS_HOST (deploy/aws/README.md); las pruebas pasaron y no se despliega."
      - uses: actions/checkout@v4
        if: env.AWS_HOST != ''
        with:
          sparse-checkout: deploy/aws
      - uses: actions/download-artifact@v4
        if: env.AWS_HOST != ''
        with:
          name: yapa-app
          path: paquete
      - name: Subir el paquete y cambiar la versión
        if: env.AWS_HOST != ''
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/llave && printf '%s\n' "$AWS_SSH_KEY" > ~/llave
          mkdir -p ~/.ssh && ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts
          tar -czf yapa.tar.gz -C paquete .
          scp -i ~/llave yapa.tar.gz deploy/aws/desplegar.sh "ubuntu@$AWS_HOST:/tmp/"
          ssh -i ~/llave "ubuntu@$AWS_HOST" "sudo install -m 755 /tmp/desplegar.sh /opt/yapa/bin/desplegar.sh && sudo /opt/yapa/bin/desplegar.sh /tmp/yapa.tar.gz ${{ github.sha }}"
          rm -f ~/llave

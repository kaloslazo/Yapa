# Pruebas en cada subida y pull request (jobs motor y web, de Kalos) + despliegue automático (iteración 52,
# api/docs/desarrollo/52-despliegue-automatico.md):
#   - Cada subida a cualquier rama y cada pull request corren las pruebas y arman el paquete (DA-01, DA-02).
#   - Solo una subida a main despliega en la VPS (S-270), y solo si pasaron motor y web (S-271).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  motor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyJWT cryptography  # S-214: sin esto se saltan las pruebas de Google
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # DA-02: el paquete (api/src y dist) con la misma forma que el paquete manual
      - name: Armar el paquete
        run: |
          mkdir -p paquete/api
          cp -r api/src paquete/api/src
          cp -r dist paquete/dist
          find paquete -name '__pycache__' -type d -prune -exec rm -rf {} +
          test -f paquete/dist/index.html
          test -f paquete/api/src/yapa_sdd/web/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: yapa-app
          path: paquete
          if-no-files-found: error
          retention-days: 14

  desplegar:
    name: desplegar en la VPS
    needs: [motor, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, yapa-vps]
    timeout-minutes: 15
    concurrency:
      group: despliegue-yapa
      cancel-in-progress: false
    steps:
      # Sin acciones de GitHub: el Windows de la VPS no corre Node 24. Solo comandos.
      # El script vive en la VPS (S-273): el repositorio solo lo llama.
      - name: Descargar el paquete y reemplazar la versión
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: C:\yapa\ci\desplegar-ci.ps1 -Repo "${{ github.repository }}" -RunId "${{ github.run_id }}"

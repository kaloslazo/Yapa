# Iteración 49 · CI y despliegue automático (api/docs/desarrollo/49-despliegue-automatico.md)
#   - Cada subida a cualquier rama y cada pull request hacia main: pruebas, tipos y compilación (DA-01).
#   - Solo una subida a main despliega en la VPS (S-259), después de que pasen las pruebas (S-260).
name: CI y despliegue

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y paquete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruebas del motor
        working-directory: api
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --disable-pip-version-check "PyJWT>=2.8,<3" "cryptography>=42"
          python -m unittest discover -s tests

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias de la web
        run: npm ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Pruebas de la web
        run: npm test

      - name: Compilar la web
        run: npm run build

      - name: Armar el paquete (api/src y dist)
        run: |
          mkdir -p paquete/api
          cp -r api/src paquete/api/src
          cp -r dist paquete/dist
          find paquete -name '__pycache__' -type d -prune -exec rm -rf {} +
          test -f paquete/dist/index.html
          test -f paquete/api/src/yapa_sdd/web/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: yapa-app
          path: paquete
          if-no-files-found: error
          retention-days: 14

  desplegar:
    name: Desplegar en la VPS
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, yapa-vps]
    timeout-minutes: 15
    concurrency:
      group: despliegue-yapa
      cancel-in-progress: false
    steps:
      # Sin acciones de GitHub: el Windows de la VPS no corre Node 24. Solo comandos.
      # El script vive en la VPS (S-262): el repositorio solo lo llama.
      - name: Descargar el paquete y reemplazar la versión
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: C:\yapa\ci\desplegar-ci.ps1 -Repo "${{ github.repository }}" -RunId "${{ github.run_id }}"
